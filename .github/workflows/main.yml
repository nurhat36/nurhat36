name: Generate Profile Animations

on:
  schedule:
    - cron: '0 3 * * *' # Her gün saat 03:00 UTC'de çalışır
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Snake Animasyonunu Oluştur
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nurhat36
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Pacman Animasyonunu Oluştur
      - name: Generate Pacman SVGs
        id: generate_pacman
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: nurhat36

      # 3. Klasör Kontrolü
      - name: Verify output was generated
        id: check_dist
        run: |
          if [ -d "dist" ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 4. Hepsini Tek Seferde Output Branch'ine Gönder
      - name: Publish graphs to output branch
        if: steps.check_dist.outputs.exists == 'true'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
